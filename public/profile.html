<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0f172a; --card: #1e293b; --success: #10b981; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 1000; display: none; }
        .avatar-box { width: 130px; height: 130px; border: 4px solid var(--primary); border-radius: 50%; margin: 30px auto; overflow: hidden; background: #0b1120; cursor: pointer; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .edit-input { background: var(--card); border: 1px solid #334155; color: white; font-size: 1.4rem; text-align: center; border-radius: 12px; width: 80%; padding: 12px; outline: none; }
        .uid-tag { background: #0b1120; padding: 14px; border-radius: 12px; color: var(--primary); font-family: monospace; border: 1px solid #334155; margin-top: 20px; display: inline-block; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <div id="toast">Message</div>
    <h2 style="margin-top: 20px;">Profile</h2>
    
    <div class="avatar-box" onclick="document.getElementById('fileInput').click()">
        <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>
    <input type="file" id="fileInput" style="display:none" accept="image/*">
    
    <input type="text" id="nameEdit" class="edit-input" onchange="updateProfile(this.value)">
    
    <div><div class="uid-tag">ID: <span id="uID">------</span></div> <button onclick="copyUID()" style="background:none;border:none;font-size:1.5rem;cursor:pointer">📋</button></div>

    <nav class="nav-bar">
        <a href="index.html" style="color:#94a3b8; text-decoration:none">🏠<br><small>Home</small></a>
        <a href="friends.html" style="color:#94a3b8; text-decoration:none">👥<br><small>Friends</small></a>
        <a href="game.html" style="color:#94a3b8; text-decoration:none">♟️<br><small>Play</small></a>
        <a href="profile.html" style="color:var(--primary); text-decoration:none">👤<br><small>Me</small></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAP5BADrbyPaeR8WYVzZToWabxeVBDTo5I", 
            databaseURL: "https://client-b83b3-default-rtdb.firebaseio.com/",
            projectId: "client-b83b3", 
            appId: "1:653007015347:web:5f8c425c5890d4d86f4fc6" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = localStorage.getItem('chessUser');
        let myUID = localStorage.getItem('chessUID');

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function init() {
            if(!myUID) {
                myUID = Math.floor(100000 + Math.random() * 900000);
                localStorage.setItem('chessUID', myUID);
            }
            document.getElementById('uID').innerText = myUID;

            if (myName) {
                db.ref('users/' + myName).once('value', snap => {
                    const d = snap.val();
                    if (d) {
                        if (d.photo) document.getElementById('profilePic').src = d.photo;
                        document.getElementById('nameEdit').value = d.name;
                    }
                });
            } else {
                myName = "Player" + myUID.toString().substring(0,3);
                localStorage.setItem('chessUser', myName);
                document.getElementById('nameEdit').value = myName;
                updateProfile(myName);
            }
        }

        async function updateProfile(newName) {
            if(!newName.trim()) return;
            const oldName = myName;
            myName = newName.trim();
            localStorage.setItem('chessUser', myName);
            const photoUrl = document.getElementById('profilePic').src;
            if (oldName && oldName !== myName) await db.ref('users/' + oldName).remove();
            db.ref('users/' + myName).set({ name: myName, uid: parseInt(myUID), photo: photoUrl })
            .then(() => showToast("Saved!"));
        }

        function copyUID() {
            navigator.clipboard.writeText(myUID);
            showToast("ID Copied!");
        }

        document.getElementById('fileInput').onchange = async e => {
            const fd = new FormData(); fd.append('image', e.target.files[0]);
            showToast("Uploading...");
            const res = await fetch('https://api.imgbb.com/1/upload?key=6ae309e5e122f3aca2f9142fc3b2bd0a', { method: 'POST', body: fd });
            const json = await res.json();
            document.getElementById('profilePic').src = json.data.url;
            updateProfile(myName);
        };
        init();
    </script>
</body>
</html>
