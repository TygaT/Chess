<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Hub</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0f172a; --card: #1e293b; --success: #10b981; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        
        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; z-index: 1000; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideUp 0.3s; }
        @keyframes slideUp { from { bottom: 50px; opacity: 0; } to { bottom: 100px; opacity: 1; } }

        #challengePop { display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--primary); color:#000; padding:15px; border-radius:12px; z-index:100; width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.5); font-weight:bold; }

        .tabs { display: flex; background: var(--card); border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #94a3b8; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        
        .content { padding: 15px; display: none; }
        .content.active { display: block; }

        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; background: var(--card); border: 1px solid #334155; color: white; border-radius: 10px; outline: none; }
        .search-btn { background: var(--primary); border: none; border-radius: 10px; padding: 0 20px; font-weight: bold; cursor: pointer; color: #000; }

        .user-card { background: var(--card); padding: 12px; border-radius: 15px; display: flex; align-items: center; margin-bottom: 10px; border: 1px solid #334155; animation: fadeIn 0.3s ease; }
        .user-card img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; object-fit: cover; border: 2px solid var(--primary); }
        .user-info { flex-grow: 1; }
        .user-info b { display: block; font-size: 1.1rem; }
        .user-info small { color: #94a3b8; }
        
        .action-btn { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="toast">Message</div>
    <div id="challengePop">
        <span id="challengerName">Someone</span> challenged you!
        <div style="margin-top:10px; display:flex; gap:10px;">
            <button onclick="respondChallenge(true)" style="flex:1; padding:12px; background:#000; color:#fff; border:none; border-radius:8px; font-weight:bold;">ACCEPT</button>
            <button onclick="respondChallenge(false)" style="flex:1; padding:12px; background:rgba(0,0,0,0.2); border:none; border-radius:8px;">DECLINE</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'searchTab')">Search</button>
        <button class="tab-btn" onclick="switchTab(event, 'requestTab')">Requests</button>
        <button class="tab-btn" onclick="switchTab(event, 'friendsTab')">Friends</button>
    </div>

    <div id="searchTab" class="content active">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Name or 6-digit ID...">
            <button class="search-btn" onclick="searchUser()">🔍</button>
        </div>
        <div id="searchResult"></div>
    </div>

    <div id="requestTab" class="content"><div id="requestList"></div></div>
    <div id="friendsTab" class="content"><div id="friendList"></div></div>

    <nav class="nav-bar">
        <a href="index.html" style="color:#94a3b8; text-decoration:none">🏠<br><small>Home</small></a>
        <a href="friends.html" style="color:var(--primary); text-decoration:none">👥<br><small>Friends</small></a>
        <a href="game.html" style="color:#94a3b8; text-decoration:none">♟️<br><small>Play</small></a>
        <a href="profile.html" style="color:#94a3b8; text-decoration:none">👤<br><small>Me</small></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAP5BADrbyPaeR8WYVzZToWabxeVBDTo5I", 
            databaseURL: "https://client-b83b3-default-rtdb.firebaseio.com/",
            projectId: "client-b83b3", 
            appId: "1:653007015347:web:5f8c425c5890d4d86f4fc6" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myName = localStorage.getItem('chessUser');

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function switchTab(e, id) {
            document.querySelectorAll('.content').forEach(c => c.style.display = "none");
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = "block";
            e.currentTarget.classList.add('active');
        }

        if (myName) {
            // CHALLENGES
            db.ref('challenges/' + myName).on('value', snap => {
                const d = snap.val();
                if(d && d.status === "pending") {
                    document.getElementById('challengerName').innerText = d.from;
                    document.getElementById('challengePop').style.display = "block";
                } else if(d && d.status === "accepted") {
                    window.location.href = "game.html?room=" + d.room;
                }
            });

            // REQUESTS FIX
            db.ref('users/' + myName + '/requests').on('value', async snap => {
                const list = document.getElementById('requestList');
                list.innerHTML = snap.exists() ? "" : "<p style='text-align:center;color:#94a3b8'>No requests.</p>";
                if(snap.exists()){
                    for(let name in snap.val()){
                        const uSnap = await db.ref('users/'+name).once('value');
                        const u = uSnap.val();
                        if(u) {
                            list.innerHTML += `<div class="user-card"><img src="${u.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"><div class="user-info"><b>${name}</b></div><button class="action-btn" onclick="acceptFriend('${name}')">Accept</button></div>`;
                        }
                    }
                }
            });

            // FRIENDS
            db.ref('users/' + myName + '/myFriends').on('value', async snap => {
                const list = document.getElementById('friendList');
                list.innerHTML = snap.exists() ? "" : "<p style='text-align:center;color:#94a3b8'>Add some friends!</p>";
                if(snap.exists()){
                    for(let name in snap.val()){
                        const uSnap = await db.ref('users/'+name).once('value');
                        const u = uSnap.val();
                        if(u) {
                            list.innerHTML += `<div class="user-card"><img src="${u.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"><div class="user-info"><b>${name}</b></div><button class="action-btn" onclick="startChallenge('${name}')">⚔️ PLAY</button></div>`;
                        }
                    }
                }
            });
        }

        function searchUser() {
            const term = document.getElementById('searchInput').value.trim();
            const res = document.getElementById('searchResult');
            res.innerHTML = "Searching...";
            let q = db.ref('users').orderByChild('name').equalTo(term);
            if(!isNaN(term) && term.length === 6) q = db.ref('users').orderByChild('uid').equalTo(parseInt(term));

            q.once('value', snap => {
                res.innerHTML = snap.exists() ? "" : "❌ User not found.";
                snap.forEach(child => {
                    const u = child.val();
                    if(u.name === myName) return;
                    res.innerHTML += `<div class="user-card"><img src="${u.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"><div class="user-info"><b>${u.name}</b><small>ID: ${u.uid}</small></div><button class="action-btn" onclick="sendRequest('${u.name}')">Add</button></div>`;
                });
            });
        }

        function sendRequest(target) { 
            db.ref('users/' + target + '/requests/' + myName).set(true); 
            showToast("Sent to " + target); 
        }
        
        function acceptFriend(name) {
            db.ref('users/'+myName+'/myFriends/'+name).set(true);
            db.ref('users/'+name+'/myFriends/'+myName).set(true);
            db.ref('users/'+myName+'/requests/'+name).remove();
            showToast("Added " + name);
        }

        function startChallenge(target) {
            const room = "room_" + Math.random().toString(36).substr(2, 9);
            db.ref('challenges/' + target).set({ from: myName, status: "pending", room: room });
            showToast("Challenge sent!");
            db.ref('challenges/' + target).on('value', snap => {
                if(snap.val()?.status === "accepted") window.location.href = "game.html?room=" + room;
            });
        }

        function respondChallenge(accepted) {
            document.getElementById('challengePop').style.display = "none";
            if(accepted) {
                db.ref('challenges/' + myName).update({ status: "accepted" });
            } else {
                db.ref('challenges/' + myName).remove();
            }
        }
    </script>
</body>
</html>
