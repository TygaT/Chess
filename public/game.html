<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyga's Chess</title>
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --primary: #00d4ff; --bg: #0f172a; --card: #1e293b; --blood: #ef4444; --green: #22c55e; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: var(--card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        
        .timer-container { position: relative; width: 40px; height: 40px; transition: opacity 0.3s ease; opacity: 0; }
        .timer-svg { transform: rotate(-90deg); width: 40px; height: 40px; }
        .timer-circle { fill: none; stroke: var(--green); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }

        .main-game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px 0; }
        
        #board-wrapper { position: relative; width: 92vw; max-width: 400px; }
        #myBoard { width: 100%; border: 4px solid #334155; }

        /* Smooth Transition Overlay */
        #status-overlay { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 1000; 
            background: none; 
            text-align: center;
            pointer-events: none; /* Prevents blocking clicks on pieces */
            width: 100%;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.6s ease-in-out; /* Smooth fade in */
        }

        #status-overlay.show {
            opacity: 1;
        }

        .small-notify { 
            font-family: 'Nosifer', cursive;
            font-size: 2.2rem; 
            color: var(--blood); 
            text-shadow: 0 0 15px rgba(0,0,0,1), 0 0 5px rgba(239, 68, 68, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .highlight-move { box-shadow: inset 0 0 0 3px rgba(255, 255, 0, 0.8) !important; }
        .check-warning { box-shadow: inset 0 0 0 4px var(--blood) !important; }

        .nav-bar { background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; }
        .status-text { color: var(--primary); font-weight: bold; font-size: 0.85rem; }
        .btn-quit { color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:void(0)" onclick="manualQuit()" class="btn-quit">← Quit</a>
        <div class="timer-container">
            <svg class="timer-svg"><circle class="timer-circle" cx="20" cy="20" r="16"></circle></svg>
        </div>
        <div id="turnStatus" class="status-text">Connecting...</div>
    </div>

    <div class="main-game-area">
        <div id="board-wrapper">
            <div id="status-overlay">
                <div id="overlay-msg" class="small-notify">CHECKMATE</div>
            </div>
            <div id="myBoard"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="javascript:void(0)" onclick="manualQuit()" style="color:#94a3b8; text-decoration:none; text-align:center; font-size:0.8rem;">🏠<br>Home</a>
        <a href="friends.html" style="color:var(--primary); text-decoration:none; text-align:center; font-size:0.8rem;">👥<br>Friends</a>
        <a href="game.html" style="color:#94a3b8; text-decoration:none; text-align:center; font-size:0.8rem;">♟️<br>Play</a>
        <a href="profile.html" style="color:#94a3b8; text-decoration:none; text-align:center; font-size:0.8rem;">👤<br>Me</a>
    </nav>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAP5BADrbyPaeR8WYVzZToWabxeVBDTo5I", 
            databaseURL: "https://client-b83b3-default-rtdb.firebaseio.com/",
            projectId: "client-b83b3", appId: "1:653007015347:web:5f8c425c5890d4d86f4fc6" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        const roomID = urlParams.get('room');
        const myName = localStorage.getItem('chessUser');

        let board = null, game = new Chess(), myColor = 'w', sourceSquare = null;
        let timerInterval, timeLeft = 45;
        const roomRef = db.ref('rooms/' + roomID);
        const playersRef = roomRef.child('players');

        function init() {
            if (!roomID) { window.location.href="index.html"; return; }
            playersRef.transaction((p) => {
                if (!p) return { [myName]: 'w' };
                if (!p[myName]) {
                    const players = Object.keys(p);
                    if (players.length >= 2) return; 
                    p[myName] = (p[players[0]] === 'w') ? 'b' : 'w';
                }
                return p;
            }, (err, committed, snap) => {
                if (!committed) { window.location.href="index.html"; return; }
                myColor = snap.val()[myName];
                setupBoard();
                listen();
            });
        }

        function manualQuit() {
            playersRef.child(myName).remove().then(() => {
                roomRef.remove(); 
                window.location.replace(window.location.origin + "/friends.html"); 
            });
        }

        function showOverlay(msg, redirectDelay = 5000) {
            const overlay = document.getElementById('status-overlay');
            const msgBox = document.getElementById('overlay-msg');
            
            msgBox.innerText = msg;
            overlay.classList.add('show'); // Triggers smooth fade in
            
            clearInterval(timerInterval);
            
            setTimeout(() => {
                window.location.replace(window.location.origin + "/friends.html");
            }, redirectDelay);
        }

        function startTimer() {
            clearInterval(timerInterval);
            const container = document.querySelector('.timer-container');
            const circle = document.querySelector('.timer-circle');

            if (game.turn() === myColor && !game.game_over()) {
                container.style.opacity = "1";
                timeLeft = 45;
                circle.style.transition = 'none';
                circle.style.strokeDashoffset = '0';
                circle.style.stroke = "#22c55e"; 
                circle.getBoundingClientRect(); 
                circle.style.transition = 'stroke-dashoffset 1s linear';

                timerInterval = setInterval(() => {
                    timeLeft--;
                    circle.style.strokeDashoffset = 100 - (timeLeft / 45) * 100;
                    if (timeLeft <= 5) circle.style.stroke = "#ef4444";
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        if (game.turn() === myColor) forceTurnSwitch();
                    }
                }, 1000);
            } else { container.style.opacity = "0"; }
        }

        function forceTurnSwitch() {
            const parts = game.fen().split(' ');
            parts[1] = parts[1] === 'w' ? 'b' : 'w';
            roomRef.update({ fen: parts.join(' '), time: Date.now() });
        }

        function setupBoard() {
            board = Chessboard('myBoard', {
                draggable: false, orientation: myColor === 'w' ? 'white' : 'black', position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#myBoard').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                const piece = game.get(square);
                if (game.turn() !== myColor || game.game_over()) return;

                if (!sourceSquare) {
                    if (piece && piece.color === myColor) {
                        sourceSquare = square;
                        showMoves(square);
                    }
                } else {
                    const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                    if (move) {
                        board.position(game.fen());
                        document.querySelector('.timer-container').style.opacity = "0";
                        clearInterval(timerInterval);
                        roomRef.update({ fen: game.fen(), lastMove: { from: sourceSquare, to: square }, time: Date.now() });
                        sourceSquare = null;
                        $('.square-55d63').removeClass('highlight-move');
                    } else if (piece && piece.color === myColor) {
                        sourceSquare = square;
                        showMoves(square);
                    }
                }
            });
        }

        function showMoves(square) {
            $('.square-55d63').removeClass('highlight-move');
            $('.square-' + square).addClass('highlight-move');
            game.moves({ square: square, verbose: true }).forEach(m => $('.square-' + m.to).addClass('highlight-move'));
        }

        function listen() {
            playersRef.on('child_removed', snap => {
                if (snap.key !== myName) {
                    showOverlay(`${snap.key.toUpperCase()} SURRENDERED`, 5000);
                }
            });

            roomRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;
                if (data.fen && data.fen !== game.fen()) {
                    game.load(data.fen);
                    board.position(data.fen);
                    startTimer();
                }
                updateGameUI(data.lastMove);
            });
        }

        function updateGameUI(lastMove) {
            $('.square-55d63').removeClass('highlight-move check-warning');
            if (lastMove) {
                $('.square-' + lastMove.from).addClass('highlight-move');
                $('.square-' + lastMove.to).addClass('highlight-move');
            }

            if (game.in_check()) {
                const turn = game.turn();
                const boardArray = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = boardArray[r][c];
                        if (p && p.type === 'k' && p.color === turn) {
                            const sq = String.fromCharCode(97 + c) + (8 - r);
                            $('.square-' + sq).addClass('check-warning');
                        }
                    }
                }
            }

            if (game.in_checkmate()) {
                showOverlay("CHECKMATE", 10000);
            } else {
                document.getElementById('turnStatus').innerText = (game.turn() === myColor) ? "Your Turn" : "Opponent Turn";
            }
        }

        init();
    </script>
</body>
</html>
