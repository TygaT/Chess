<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyga Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d4ff; --bg: #0f172a; --card: #1e293b; --blood: #b91c1c; --green: #22c55e; --yellow: #eab308; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: var(--card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        
        /* TIMER */
        .timer-container { position: relative; width: 40px; height: 40px; transition: opacity 0.3s ease; opacity: 0; }
        .timer-svg { transform: rotate(-90deg); width: 40px; height: 40px; }
        .timer-circle { fill: none; stroke: var(--green); stroke-width: 4; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.3s ease; }

        /* MAIN GAME AREA */
        .main-game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        #myBoard { width: 92vw; max-width: 400px; border: 4px solid #334155; line-height: 0; position: relative; }

        /* OUTLINES */
        .highlight-move { box-shadow: inset 0 0 0 3px rgba(255, 255, 0, 0.8) !important; z-index: 10; }
        .check-warning { box-shadow: inset 0 0 0 4px var(--blood) !important; z-index: 11; }

        /* OVERLAYS */
        #checkmate-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 100%; pointer-events: none; }
        .bloody-text { font-family: 'Nosifer', cursive; font-size: 1.8rem; color: var(--blood); text-align: center; text-shadow: 2px 2px 10px #000; }

        .nav-bar { background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; }
        .status-text { color: var(--primary); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" style="color:var(--primary); text-decoration:none">← Quit</a>
        <div class="timer-container">
            <svg class="timer-svg"><circle class="timer-circle" cx="20" cy="20" r="16"></circle></svg>
        </div>
        <div id="turnStatus" class="status-text">Connecting...</div>
    </div>

    <div class="main-game-area">
        <div id="myBoard"></div>
        <div id="checkmate-overlay"><div class="bloody-text">CHECKMATE</div></div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" style="color:#94a3b8; text-decoration:none; text-align:center; font-size:0.8rem;">🏠<br>Home</a>
        <a href="game.html" style="color:var(--primary); text-decoration:none; text-align:center; font-size:0.8rem;">♟️<br>Play</a>
        <a href="profile.html" style="color:#94a3b8; text-decoration:none; text-align:center; font-size:0.8rem;">👤<br>Me</a>
    </nav>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAP5BADrbyPaeR8WYVzZToWabxeVBDTo5I", 
            databaseURL: "https://client-b83b3-default-rtdb.firebaseio.com/",
            projectId: "client-b83b3", appId: "1:653007015347:web:5f8c425c5890d4d86f4fc6" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        const roomID = urlParams.get('room');
        const myName = localStorage.getItem('chessUser');

        let board = null, game = new Chess(), myColor = 'w', sourceSquare = null;
        let timerInterval, timeLeft = 45;
        const roomRef = db.ref('rooms/' + roomID);

        function init() {
            if (!roomID) { window.location.href="index.html"; return; }
            roomRef.child('players').transaction((p) => {
                if (!p) return { [myName]: 'w' };
                if (!p[myName]) {
                    const existing = Object.values(p)[0];
                    p[myName] = (existing === 'w') ? 'b' : 'w';
                }
                return p;
            }, (err, committed, snap) => {
                myColor = snap.val()[myName];
                setupBoard();
                listen();
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            const container = document.querySelector('.timer-container');
            const circle = document.querySelector('.timer-circle');

            if (game.turn() === myColor && !game.game_over()) {
                container.style.opacity = "1";
                timeLeft = 45;
                circle.style.transition = 'none';
                circle.style.strokeDashoffset = '0';
                circle.style.stroke = "#22c55e"; 
                circle.getBoundingClientRect(); 
                circle.style.transition = 'stroke-dashoffset 1s linear, stroke 0.3s ease';

                timerInterval = setInterval(() => {
                    timeLeft--;
                    let offset = 100 - (timeLeft / 45) * 100;
                    circle.style.strokeDashoffset = offset;
                    
                    if (timeLeft <= 5) circle.style.stroke = "#ef4444";
                    else if (timeLeft <= 20) circle.style.stroke = "#eab308";

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        if (game.turn() === myColor) forceTurnSwitch();
                    }
                }, 1000);
            } else {
                container.style.opacity = "0";
            }
        }

        function forceTurnSwitch() {
            const parts = game.fen().split(' ');
            parts[1] = parts[1] === 'w' ? 'b' : 'w';
            roomRef.update({ fen: parts.join(' '), time: Date.now() });
        }

        function setupBoard() {
            board = Chessboard('myBoard', {
                draggable: false, orientation: myColor === 'w' ? 'white' : 'black', position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });

            $('#myBoard').on('click', '.square-55d63', function() {
                const square = $(this).attr('data-square');
                const piece = game.get(square);
                
                if (game.turn() !== myColor || game.game_over()) return;

                if (!sourceSquare) {
                    if (piece && piece.color === myColor) {
                        sourceSquare = square;
                        showMoves(square);
                    }
                } else {
                    const move = game.move({ from: sourceSquare, to: square, promotion: 'q' });
                    if (move) {
                        board.position(game.fen());
                        document.querySelector('.timer-container').style.opacity = "0";
                        clearInterval(timerInterval);
                        roomRef.update({ fen: game.fen(), lastMove: { from: sourceSquare, to: square }, time: Date.now() });
                        sourceSquare = null;
                        $('.square-55d63').removeClass('highlight-move');
                    } else if (piece && piece.color === myColor) {
                        sourceSquare = square;
                        showMoves(square);
                    }
                }
            });
        }

        function showMoves(square) {
            $('.square-55d63').removeClass('highlight-move');
            $('.square-' + square).addClass('highlight-move');
            game.moves({ square: square, verbose: true }).forEach(m => $('.square-' + m.to).addClass('highlight-move'));
        }

        function listen() {
            roomRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;
                if (data.fen && data.fen !== game.fen()) {
                    game.load(data.fen);
                    board.position(data.fen);
                    startTimer();
                }
                updateGameUI(data.lastMove);
            });
        }

        function updateGameUI(lastMove) {
            $('.square-55d63').removeClass('highlight-move check-warning');
            if (lastMove) {
                $('.square-' + lastMove.from).addClass('highlight-move');
                $('.square-' + lastMove.to).addClass('highlight-move');
            }

            if (game.in_check()) {
                const turn = game.turn();
                const boardArray = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = boardArray[r][c];
                        if (p && p.type === 'k' && p.color === turn) {
                            const sq = String.fromCharCode(97 + c) + (8 - r);
                            $('.square-' + sq).addClass('check-warning');
                        }
                    }
                }
            }

            if (game.in_checkmate()) {
                document.getElementById('checkmate-overlay').style.display = 'block';
                document.getElementById('turnStatus').innerText = "FATALITY";
                document.getElementById('turnStatus').style.color = "var(--blood)";
                document.querySelector('.timer-container').style.opacity = "0";
                clearInterval(timerInterval);
                setTimeout(() => window.location.href = "index.html", 20000);
            } else {
                document.getElementById('turnStatus').innerText = (game.turn() === myColor) ? "Your Turn" : "Opponent Turn";
                document.getElementById('turnStatus').style.color = "var(--primary)";
            }
        }

        init();
    </script>
</body>
</html>
